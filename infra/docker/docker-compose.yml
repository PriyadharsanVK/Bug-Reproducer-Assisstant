version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bug_assistant_db
    environment:
      POSTGRES_USER: bug_assistant
      POSTGRES_PASSWORD: bug_assistant_pass
      POSTGRES_DB: bug_reproducer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: bug_assistant_api
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    depends_on:
      - postgres

volumes:
  pgdata:
